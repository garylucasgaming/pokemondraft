<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Migrate Teams to MongoDB</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #1a1a1a;
      color: #fff;
    }
    h1 {
      color: #ffcb05;
      text-align: center;
    }
    .info {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .button {
      background: #3b4cca;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      margin: 10px 5px;
    }
    .button:hover {
      background: #5a6fd6;
    }
    .button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 4px;
      background: #2a2a2a;
    }
    .success {
      color: #4caf50;
    }
    .error {
      color: #f44336;
    }
    .team-list {
      margin-top: 20px;
    }
    .team-item {
      background: #2a2a2a;
      padding: 15px;
      margin: 10px 0;
      border-radius: 4px;
      border-left: 4px solid #ffcb05;
    }
    .team-pokemon {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }
    .pokemon-badge {
      background: #3b4cca;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 14px;
    }
    input {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #2a2a2a;
      color: #fff;
      margin: 5px;
      width: 200px;
    }
    label {
      display: block;
      margin-top: 10px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>🔄 Migrate Saved Teams to MongoDB</h1>
  
  <div class="info">
    <p><strong>What this tool does:</strong></p>
    <ul>
      <li>Reads saved teams from your browser's localStorage</li>
      <li>Uploads them to the MongoDB database</li>
      <li>Preserves all Pokémon details (moves, EVs, IVs, items, etc.)</li>
      <li>Does NOT delete your local data (safe to run)</li>
    </ul>
  </div>

  <div class="info">
    <label for="serverUrl">Server URL:</label>
    <input type="text" id="serverUrl" value="http://localhost:8080" placeholder="http://localhost:8080">
    
    <label for="username">Your Username (optional):</label>
    <input type="text" id="username" placeholder="Enter your username">
    
    <label for="userId">User ID (optional - for future account linking):</label>
    <input type="text" id="userId" placeholder="Leave blank for now">
  </div>

  <button class="button" onclick="scanLocalStorage()">1. Scan localStorage for Teams</button>
  <button class="button" onclick="migrateTeams()" id="migrateBtn" disabled>2. Migrate Teams to MongoDB</button>
  <button class="button" onclick="testConnection()" style="background: #4caf50;">Test Server Connection</button>

  <div id="status" class="status"></div>
  <div id="teamList" class="team-list"></div>

  <script>
    let teamsToMigrate = [];

    async function testConnection() {
      const serverUrl = document.getElementById('serverUrl').value;
      const status = document.getElementById('status');
      
      status.innerHTML = '⏳ Testing connection...';
      
      try {
        const response = await fetch(`${serverUrl}/health`);
        if (response.ok) {
          status.innerHTML = '<span class="success">✅ Server is online and ready!</span>';
        } else {
          status.innerHTML = '<span class="error">❌ Server responded but not OK</span>';
        }
      } catch (error) {
        status.innerHTML = `<span class="error">❌ Connection failed: ${error.message}</span>`;
      }
    }

    function scanLocalStorage() {
      const status = document.getElementById('status');
      const teamList = document.getElementById('teamList');
      const migrateBtn = document.getElementById('migrateBtn');
      
      teamsToMigrate = [];
      
      // Scan for saved teams
      const SAVED_TEAMS_KEY = 'pkmndraft_saved_teams';
      try {
        const raw = localStorage.getItem(SAVED_TEAMS_KEY);
        if (raw) {
          const teams = JSON.parse(raw);
          if (Array.isArray(teams) && teams.length > 0) {
            teamsToMigrate = teams;
          }
        }
      } catch (e) {
        console.error('Error reading saved teams:', e);
      }

      if (teamsToMigrate.length === 0) {
        status.innerHTML = '<span class="error">❌ No saved teams found in localStorage</span>';
        teamList.innerHTML = '';
        migrateBtn.disabled = true;
        return;
      }

      status.innerHTML = `<span class="success">✅ Found ${teamsToMigrate.length} team(s) in localStorage</span>`;
      
      // Display teams
      let html = '<h3>Teams Ready to Migrate:</h3>';
      teamsToMigrate.forEach((team, index) => {
        const pokemonCount = team.data?.pokemon?.length || 0;
        const pokemonNames = team.data?.pokemon?.map(p => p.name).filter(Boolean).slice(0, 6) || [];
        
        html += `
          <div class="team-item">
            <strong>Team ${index + 1}: ${team.name || 'Unnamed'}</strong>
            ${team.playerName ? `<br><small>Player: ${team.playerName}</small>` : ''}
            <br><small>Created: ${new Date(team.savedAt).toLocaleDateString()}</small>
            <br><small>${pokemonCount} Pokémon</small>
            <div class="team-pokemon">
              ${pokemonNames.map(name => `<span class="pokemon-badge">${name}</span>`).join('')}
            </div>
          </div>
        `;
      });
      
      teamList.innerHTML = html;
      migrateBtn.disabled = false;
    }

    async function migrateTeams() {
      const serverUrl = document.getElementById('serverUrl').value;
      const username = document.getElementById('username').value || 'Anonymous';
      const userId = document.getElementById('userId').value || `browser_${Date.now()}`;
      const status = document.getElementById('status');
      const migrateBtn = document.getElementById('migrateBtn');
      
      if (teamsToMigrate.length === 0) {
        status.innerHTML = '<span class="error">❌ No teams to migrate. Click "Scan localStorage" first.</span>';
        return;
      }

      migrateBtn.disabled = true;
      status.innerHTML = '⏳ Migrating teams...';

      let successCount = 0;
      let errorCount = 0;
      const results = [];

      for (const team of teamsToMigrate) {
        try {
          // Transform localStorage format to MongoDB format
          const pokemon = [];
          
          if (team.data && team.data.pokemon) {
            for (const p of team.data.pokemon) {
              if (p.name) {
                pokemon.push({
                  name: p.name,
                  moves: p.moves || [],
                  ability: p.ability || '',
                  item: p.item || '',
                  nature: p.nature || '',
                  teraType: p.teraType || '',
                  evs: p.evs || { hp: 0, attack: 0, defense: 0, specialAttack: 0, specialDefense: 0, speed: 0 },
                  ivs: p.ivs || { hp: 31, attack: 31, defense: 31, specialAttack: 31, specialDefense: 31, speed: 31 },
                  level: p.level || 50,
                  gender: p.gender || '',
                  shiny: p.shiny || false
                });
              }
            }
          }

          if (pokemon.length === 0) {
            results.push(`❌ ${team.name}: No valid Pokémon`);
            errorCount++;
            continue;
          }

          const payload = {
            userId: userId,
            username: team.playerName || username,
            name: team.name || 'Unnamed Team',
            pokemon: pokemon,
            format: team.data?.format || '',
            description: `Migrated from localStorage on ${new Date().toLocaleDateString()}`,
            isPublic: false
          };

          const response = await fetch(`${serverUrl}/api/teams`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });

          if (response.ok) {
            const result = await response.json();
            results.push(`✅ ${team.name}: Migrated successfully`);
            successCount++;
          } else {
            const error = await response.text();
            results.push(`❌ ${team.name}: ${error}`);
            errorCount++;
          }
        } catch (error) {
          results.push(`❌ ${team.name}: ${error.message}`);
          errorCount++;
        }
      }

      status.innerHTML = `
        <h3>Migration Complete!</h3>
        <p class="success">✅ ${successCount} teams migrated successfully</p>
        ${errorCount > 0 ? `<p class="error">❌ ${errorCount} teams failed</p>` : ''}
        <div style="margin-top: 20px;">
          ${results.map(r => `<div>${r}</div>`).join('')}
        </div>
      `;
      
      migrateBtn.disabled = false;
    }
  </script>
</body>
</html>
