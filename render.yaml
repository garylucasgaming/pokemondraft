services:
  # Backend - Socket.IO Server
  - type: web
    name: pkmndraft-server
    env: node
    buildCommand: npm install socket.io
    startCommand: node socket-server.js
    envVars:
      - key: PORT
        value: 10000

  # Frontend - React App
  - type: web
    name: pkmndraft-app
    env: static
    buildCommand: yarn install && yarn build
    staticPublishPath: ./build
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
