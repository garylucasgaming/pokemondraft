services:
  # Backend - Socket.IO Server
  - type: web
    name: pkmndraft-server
    env: node
    buildCommand: npm install socket.io
    startCommand: node socket-server.js
    envVars:
      - key: PORT
        value: 10000
  
  # Frontend - React App
  - type: web
    name: pkmndraft-app
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
